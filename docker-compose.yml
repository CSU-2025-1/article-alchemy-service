services:
  db-auth-service:
    restart: always
    image: postgres:alpine3.21
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ./data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - backend

  redis:
    restart: always
    image: redis:7.4.2-alpine
    ports:
      - "6379:6379"
    networks:
      - backend
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=admin
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 10s
      retries: 3
    networks:
      - backend
  worker:
    build:
      context: ./worker-service
      dockerfile: Dockerfile
    restart: always
    env_file:
      - .env
    environment:
      - YANDEX_TOKEN=${YANDEX_TOKEN}
      - YANDEX_API=${YANDEX_API}
      - RABBITMQ_URL=${RABBITMQ_URL}
      - RABBITMQ_QUEUE=${RABBITMQ_WORKER_QUEUE}
      - RABBITMQ_RESPONSE_QUEUE=${RABBITMQ_WORKER_RESPONSE_QUEUE}
    depends_on:
    - rabbitmq
    ports:
      - "8008:8080"
    networks:
      - backend
 

networks:
  backend:
    driver: bridge